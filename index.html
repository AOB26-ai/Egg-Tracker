<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Production Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f9fc;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c5e1a;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background: #2c5e1a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background: #234a15;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f0f4ec;
        }
        .total {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c5e1a;
            margin-top: 15px;
        }
        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .success {
            background: #e6f4ea;
            color: #1e7e34;
        }
        .error {
            background: #fdecea;
            color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>🥚 Egg Production Tracker</h1>

    <div class="card">
        <h2>Log Daily Production</h2>
        <form id="eggForm">
            <label for="shed">Shed Name</label>
            <input type="text" id="shed" placeholder="e.g. Shed A" required>

            <label for="date">Date</label>
            <input type="date" id="date" required>

            <label for="count">Egg Count</label>
            <input type="number" id="count" placeholder="e.g. 120" min="0" required>

            <button type="submit">Submit</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <div class="card">
        <h2>All Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Shed</th>
                    <th>Date</th>
                    <th>Count</th>
                </tr>
            </thead>
            <tbody id="recordsBody">
                <!-- Records will appear here -->
            </tbody>
        </table>
        <div class="total">Running Total: <span id="total">0</span> eggs</div>
    </div>

    <script>
        const form = document.getElementById('eggForm');
        const messageDiv = document.getElementById('message');
        const recordsBody = document.getElementById('recordsBody');
        const totalSpan = document.getElementById('total');

        // Set today's date as default
        document.getElementById('date').valueAsDate = new Date();

        // Load records when page opens
        loadRecords();

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const shed = document.getElementById('shed').value.trim();
            const date = document.getElementById('date').value;
            const count = document.getElementById('count').value;

            try {
                // POST new record
                const response = await fetch('/api/eggs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ shed, date, count: Number(count) })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('Record added successfully!', 'success');
                    form.reset();
                    document.getElementById('date').valueAsDate = new Date();
                    loadRecords(); // Refresh the table
                } else {
                    showMessage(result.error || 'Something went wrong', 'error');
                }
            } catch (error) {
                showMessage('Could not connect to the server', 'error');
            }
        });

        async function loadRecords() {
            try {
                const response = await fetch('/api/eggs');
                const data = await response.json();

                recordsBody.innerHTML = '';

                data.records.forEach(record => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${record.shed}</td>
                        <td>${record.date}</td>
                        <td>${record.count}</td>
                    `;
                    recordsBody.appendChild(row);
                });

                totalSpan.textContent = data.running_total;
            } catch (error) {
                console.error('Failed to load records');
            }
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
